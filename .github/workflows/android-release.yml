name: Build and release Nova

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck and tests
    if: github.repository == 'TheLoop705/nova-iptv'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test update selection and editor scrolling
        run: npm run test:updates

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android build packages
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.1.12297006'

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Test playlist pairing
        working-directory: android
        env:
          NODE_ENV: production
        run: >-
          ./gradlew --no-daemon --parallel --build-cache
          :playlist-pairing:testDebugUnitTest
          -PreactNativeArchitectures=armeabi-v7a

  release:
    name: Build Fire TV APK
    if: github.repository == 'TheLoop705/nova-iptv'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android build packages
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.1.12297006'

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Assign release version
        id: version
        run: node scripts/prepare-android-release.mjs

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Restore update-compatible signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.NOVA_ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'NOVA_ANDROID_KEYSTORE_BASE64 is not configured'; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/debug.keystore
          chmod 600 android/app/debug.keystore
          keytool -list -keystore android/app/debug.keystore -storepass android -alias androiddebugkey -v \
            | grep -qi 'FA:C6:17:45:DC:09:03:78:6F:B9:ED:E6:2A:96:2B:39:9F:73:48:F0:BB:6F:89:9B:83:32:66:75:91:03:3B:9C'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Build Fire TV APK
        working-directory: android
        env:
          NODE_ENV: production
        run: |
          # Reuse cached task outputs; assemble only the app and its dependencies.
          ./gradlew --no-daemon --parallel --build-cache --profile \
            '-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8' \
            :app:assembleRelease -PreactNativeArchitectures=armeabi-v7a
          mkdir -p ../artifacts
          cp app/build/outputs/apk/release/app-release.apk ../artifacts/Nova-firetv.apk

      - name: Verify APK and write checksum
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          EXPECTED='fac61745dc0903786fb9ede62a962b399f7348f0bb6f899b8332667591033b9c'
          "$APKSIGNER" verify --print-certs artifacts/Nova-firetv.apk | grep -qi "$EXPECTED"
          cd artifacts
          sha256sum Nova-firetv.apk > SHA256SUMS.txt

      - name: Upload verified APK
        uses: actions/upload-artifact@v7
        with:
          name: firetv-apk
          path: artifacts/
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

      - name: Save Gradle timing report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: firetv-build-profile
          path: android/build/reports/profile/
          if-no-files-found: ignore
          retention-days: 7

  windows:
    name: Build Windows installer
    if: github.repository == 'TheLoop705/nova-iptv'
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      - name: Install app dependencies
        run: npm ci

      - name: Install desktop build tools
        run: npm ci --prefix desktop

      - name: Build desktop app
        run: npm --prefix desktop run prepare:app

      - name: Check desktop startup, storage and streaming proxy
        run: npm run test:windows

      - name: Package Windows installer
        working-directory: desktop
        run: npx electron-builder --config electron-builder.yml --win nsis --x64 --publish never

      - name: Check packaged desktop app
        run: npm --prefix desktop run smoke -- --packaged

      - name: Write Windows checksum
        run: |
          $hash = (Get-FileHash release/windows/Nova-windows-x64-Setup.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $file = Join-Path $PWD 'release/windows/SHA256SUMS-windows.txt'
          [System.IO.File]::WriteAllText($file, "$hash  Nova-windows-x64-Setup.exe`n", [System.Text.UTF8Encoding]::new($false))

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: |
            release/windows/Nova-windows-x64-Setup.exe
            release/windows/SHA256SUMS-windows.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

  publish:
    name: Publish Fire TV release
    # Compilation and checks run independently; both must succeed before publishing.
    needs: [checks, release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download verified APK
        uses: actions/download-artifact@v8
        with:
          name: firetv-apk
          path: artifacts

      - name: Verify downloaded checksum
        working-directory: artifacts
        run: sha256sum --check SHA256SUMS.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: v${{ needs.release.outputs.version }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/Nova-firetv.apk artifacts/SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" \
              artifacts/Nova-firetv.apk \
              artifacts/SHA256SUMS.txt \
              --target "$GITHUB_SHA" \
              --title "Nova $VERSION" \
              --generate-notes \
              --latest
          fi

  publish-windows:
    name: Attach Windows installer to release
    # Fire TV publishes as soon as its own checks pass; Windows never delays the APK.
    needs: [windows, publish, release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download Windows installer
        uses: actions/download-artifact@v8
        with:
          name: windows-installer
          path: artifacts

      - name: Verify Windows checksum
        working-directory: artifacts
        run: sha256sum --check SHA256SUMS-windows.txt

      - name: Upload Windows release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: v${{ needs.release.outputs.version }}
        run: gh release upload "$TAG" artifacts/Nova-windows-x64-Setup.exe artifacts/SHA256SUMS-windows.txt --clobber

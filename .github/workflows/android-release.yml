name: Build and release Android

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build and publish APKs
    if: github.repository == 'TheLoop705/nova-iptv'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android build packages
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.1.12297006'

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test update selection and editor scrolling
        run: npm run test:updates

      - name: Assign release version
        id: version
        run: node scripts/prepare-android-release.mjs

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Restore update-compatible signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.NOVA_ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'NOVA_ANDROID_KEYSTORE_BASE64 is not configured'; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/debug.keystore
          chmod 600 android/app/debug.keystore
          keytool -list -keystore android/app/debug.keystore -storepass android -alias androiddebugkey -v \
            | grep -qi 'FA:C6:17:45:DC:09:03:78:6F:B9:ED:E6:2A:96:2B:39:9F:73:48:F0:BB:6F:89:9B:83:32:66:75:91:03:3B:9C'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Build Fire TV APK
        working-directory: android
        env:
          NODE_ENV: production
        run: |
          ./gradlew --no-daemon clean :playlist-pairing:testDebugUnitTest assembleRelease -PreactNativeArchitectures=armeabi-v7a
          mkdir -p ../artifacts
          cp app/build/outputs/apk/release/app-release.apk ../artifacts/Nova-firetv.apk

      - name: Build universal APK
        working-directory: android
        env:
          NODE_ENV: production
        run: |
          ./gradlew --no-daemon clean assembleRelease -PreactNativeArchitectures=armeabi-v7a,arm64-v8a
          cp app/build/outputs/apk/release/app-release.apk ../artifacts/Nova-universal.apk

      - name: Verify APKs and write checksums
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          EXPECTED='fac61745dc0903786fb9ede62a962b399f7348f0bb6f899b8332667591033b9c'
          for apk in artifacts/Nova-firetv.apk artifacts/Nova-universal.apk; do
            "$APKSIGNER" verify "$apk"
            "$APKSIGNER" verify --print-certs "$apk" | grep -qi "$EXPECTED"
          done
          cd artifacts
          sha256sum Nova-firetv.apk Nova-universal.apk > SHA256SUMS.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.version }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/Nova-firetv.apk artifacts/Nova-universal.apk artifacts/SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" \
              artifacts/Nova-firetv.apk \
              artifacts/Nova-universal.apk \
              artifacts/SHA256SUMS.txt \
              --target "$GITHUB_SHA" \
              --title "Nova $VERSION" \
              --generate-notes \
              --latest
          fi
